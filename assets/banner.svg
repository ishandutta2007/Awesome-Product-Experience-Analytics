<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="chartLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="chartAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.03); }
      100% { opacity: 0.4; transform: scale(1); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes dashOffset {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes waveMove {
      0% { transform: translateX(0px); }
      50% { transform: translateX(-20px); }
      100% { transform: translateX(0px); }
    }
    .bg-pulse {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .particle {
      animation: floatParticle 4s ease-in-out infinite;
    }
    .particle-delayed {
      animation: floatParticle 5s ease-in-out 2s infinite;
    }
    .chart-line {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: dashOffset 3s ease-out forwards;
    }
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.02em;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      fill: #94a3b8;
      letter-spacing: 0.05em;
    }
    .tag-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
  </style>

  <!-- Base Card -->
  <rect width="1200" height="400" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Glowing Ambient Circles -->
  <circle cx="150" cy="100" r="180" fill="url(#accentPurple)" opacity="0.25" filter="url(#glow)" class="bg-pulse"/>
  <circle cx="1050" cy="300" r="220" fill="url(#accentCyan)" opacity="0.2" filter="url(#glow)" class="bg-pulse"/>

  <!-- Analytics Graphic Background Curve -->
  <g transform="translate(600, 40)">
    <!-- Filled Chart Area -->
    <path d="M0,260 L60,220 L120,240 L180,170 L240,190 L300,110 L360,140 L420,70 L480,90 L540,30 L540,320 L0,320 Z" fill="url(#chartAreaGrad)" />
    
    <!-- Chart Line -->
    <path d="M0,260 L60,220 L120,240 L180,170 L240,190 L300,110 L360,140 L420,70 L480,90 L540,30" fill="none" stroke="url(#chartLineGrad)" stroke-width="4" filter="url(#softGlow)" class="chart-line" />

    <!-- Chart Data Points -->
    <circle cx="180" cy="170" r="5" fill="#38bdf8" class="particle"/>
    <circle cx="300" cy="110" r="6" fill="#818cf8" class="particle-delayed"/>
    <circle cx="420" cy="70" r="6" fill="#c084fc" class="particle"/>
    <circle cx="540" cy="30" r="7" fill="#f472b6" filter="url(#softGlow)"/>
  </g>

  <!-- Decorative Analytics UI Widget Mockup -->
  <g transform="translate(720, 70)" filter="url(#softGlow)">
    <rect width="380" height="150" rx="14" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.5"/>
    <!-- Card Header -->
    <circle cx="30" cy="30" r="6" fill="#ef4444"/>
    <circle cx="50" cy="30" r="6" fill="#f59e0b"/>
    <circle cx="70" cy="30" r="6" fill="#10b981"/>
    <text x="100" y="34" font-family="sans-serif" font-size="12" fill="#64748b" font-weight="600">LIVE USER INSIGHTS</text>

    <!-- Mini Bars -->
    <rect x="30" y="70" width="18" height="50" rx="4" fill="#38bdf8"/>
    <rect x="58" y="55" width="18" height="65" rx="4" fill="#818cf8"/>
    <rect x="86" y="80" width="18" height="40" rx="4" fill="#6366f1"/>
    <rect x="114" y="45" width="18" height="75" rx="4" fill="#c084fc"/>
    <rect x="142" y="60" width="18" height="60" rx="4" fill="#f472b6"/>

    <!-- Key Metrics Text -->
    <text x="190" y="70" font-family="sans-serif" font-size="22" font-weight="700" fill="#ffffff">+142.8%</text>
    <text x="190" y="88" font-family="sans-serif" font-size="11" fill="#94a3b8">Active Cohort Retention</text>

    <text x="190" y="120" font-family="sans-serif" font-size="22" font-weight="700" fill="#38bdf8">98.4%</text>
    <text x="190" y="138" font-family="sans-serif" font-size="11" fill="#94a3b8">Session Replay Accuracy</text>
  </g>

  <!-- Left Content Block -->
  <g transform="translate(80, 0)">
    <!-- Pill Tag -->
    <g transform="translate(0, 75)">
      <rect width="320" height="34" rx="17" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
      <text x="16" y="22" class="tag-text">⚡ CURATED ECOSYSTEM &amp; BENCHMARKS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title-text" font-size="44">Awesome Product</text>
    <text x="0" y="215" class="title-text" font-size="44" fill="url(#accentCyan)">Experience Analytics 📊</text>

    <!-- Subtitle Description -->
    <text x="0" y="260" class="subtitle-text" font-size="16">SaaS &amp; Open-Source Product Analytics, Session Replay,</text>
    <text x="0" y="285" class="subtitle-text" font-size="16">Funnels, Heatmaps, Feature Flags &amp; User Behavior Insights</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 315)">
      <rect x="0" y="0" width="125" height="30" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="19" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">📈 Market Cap</text>

      <rect x="135" y="0" width="125" height="30" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="147" y="19" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">💰 Pricing Tiers</text>

      <rect x="270" y="0" width="135" height="30" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="282" y="19" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">⭐ GitHub Stars</text>
    </g>
  </g>
</svg>
